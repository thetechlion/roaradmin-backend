name = "roaradmin-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "roaradmin"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[[kv_namespaces]]
binding = "PERMS_CACHE"
id = "REPLACE_AFTER_WRANGLER_KV_CREATE"

# One Durable Object namespace, one instance per live Roblox game-server (jobId),
# used for pushing commands to the game instantly instead of polling.
[[durable_objects.bindings]]
name = "GAME_LINK"
class_name = "GameLink"

[[migrations]]
tag = "v1"
new_classes = ["GameLink"]

[vars]
ENVIRONMENT = "development"
# CORS: the Pages dashboard's origin, e.g. https://roaradmin.pages.dev
DASHBOARD_ORIGIN = "https://roaradmin.leocool.workers.dev"

# Secrets (never go in this file) -- set with:
#   wrangler secret put SESSION_SECRET          (any long random string)
#   wrangler secret put ENCRYPTION_KEY           (base64, e.g. `openssl rand -base64 32`)
[triggers]
# Fallback poll: catches rank changes made directly in Roblox (outside the
# dashboard), which don't go through the instant push-sync path.
crons = ["*/5 * * * *"]
