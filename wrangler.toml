name = "roaradmin-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "roaradmin"
database_id = "REPLACE_AFTER_WRANGLER_D1_CREATE"

[[kv_namespaces]]
binding = "PERMS_CACHE"
id = "REPLACE_AFTER_WRANGLER_KV_CREATE"

# One Durable Object namespace, one instance per live Roblox game-server (jobId),
# used for pushing commands to the game instantly instead of polling.
[[durable_objects.bindings]]
name = "GAME_LINK"
class_name = "GameLink"

[[migrations]]
tag = "v1"
new_classes = ["GameLink"]

[vars]
ENVIRONMENT = "development"
